# ~/.tmux.conf — managed via dotfiles (projects/tmux.project)
# Reload:  prefix + r

# ── Terminal / colors ───────────────────────────────────────────────
# tmux-256color is the correct entry for tmux 3.x (italics, proper redraws).
# Outer terminal is Ghostty (xterm-ghostty) — enable truecolor passthrough.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"

# ── Prefix (C-a instead of C-b) ─────────────────────────────────────
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# ── General behaviour ───────────────────────────────────────────────
set -g mouse on
set -g base-index 1                  # windows start at 1
set -g pane-base-index 1             # panes start at 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on    # keep window numbers gapless
set -sg escape-time 10               # snappy ESC in nvim
set -g history-limit 50000
set -g focus-events on               # let nvim see focus in/out
set-window-option -g aggressive-resize on
set-window-option -g mode-keys vi    # vi keys in copy-mode

# ── Shell ───────────────────────────────────────────────────────────
# Launch fish in interactive panes via default-command (fast, direct).
# Keep a POSIX shell as default-shell: tmux uses default-shell to run its
# OWN jobs (run-shell hooks, if-shell, #() status commands). fish there
# breaks them — that caused the continuum "didn't start" error and the
# pane/window-switch freezes.
set -g default-command /opt/homebrew/bin/fish
set -g default-shell   /bin/zsh

# ── Key bindings ────────────────────────────────────────────────────
# reload config
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# splits keep current path; nicer | and -
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# resize panes with vim keys (repeatable)
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r m resize-pane -Z             # zoom toggle

# Shift+Alt vim keys / Shift arrows to switch windows
bind -n M-H previous-window
bind -n M-L next-window
bind -n S-Left  previous-window
bind -n S-Right next-window

# copy-mode (vi)
bind-key -T copy-mode-vi v send-keys -X begin-selection       # start selecting with "v"
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel  # copy with "y"
unbind -T copy-mode-vi MouseDragEnd1Pane   # don't exit copy-mode on drag-release

# ── Gamify — Hollow Knight sound on pane/window switch ──────────────
# Routed through ~/bin/hk-action → `gamify play quick-action`: mute-aware
# and storm-guarded so restore-at-boot can't flood it.
# Toggle with:  gamify mute  /  gamify unmute
set-hook -g window-linked       'run-shell "~/bin/hk-action"'
set-hook -g after-select-window 'run-shell "~/bin/hk-action"'
set-hook -g after-select-pane   'run-shell "~/bin/hk-action"'

# ── Plugins (tpm) ───────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'      # sane defaults
set -g @plugin 'christoomey/vim-tmux-navigator'  # C-h/j/k/l nav vim<->tmux
set -g @plugin 'jimeh/tmux-themepack'            # theme (loads before continuum)
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'     # save/restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'     # auto-save every 15 min + restore
# set -g @plugin 'conmute/tmux-spire'            # disabled

# theme
set -g @themepack 'powerline/default/cyan'

# resurrect / continuum
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
