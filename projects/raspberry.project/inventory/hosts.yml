all:
  hosts:
    productforge:
      ansible_host: "{{ lookup('env', 'PI_HOST') | default('productforge.local', true) }}"
      ansible_user: "{{ lookup('env', 'PI_USER') | default('ross', true) }}"
      ansible_ssh_private_key_file: "{{ lookup('env', 'SSH_KEY') | default('~/.ssh/id_productforge', true) }}"
      ansible_python_interpreter: /usr/bin/python3
      ssd_mount: /mnt/ssd
      app_base: /opt/productforge
